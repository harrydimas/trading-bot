version: "3.9"

services:
  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpass
      POSTGRES_DB: trading

  bot:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - bot-data:/app/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bot-data: